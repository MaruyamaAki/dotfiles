# vim: ft=tmux
#### Iceberg‑Dark Statusline (v2.3) ###########################################
# Palette
#   bg0  #161821  (terminal background)
#   bg1  #1e2132  (window segment background)
#   bg2  #2e3244  (statusline background)
#   fg   #c6c8d1  (normal text)
#   dim  #6b7089  (subtle)
#   acc  #84a0c6  (accent blue)
###############################################################################

### Copy‑mode & messages ######################################################
set -g mode-style            "fg=#c6c8d1,bg=#1e2132"
set -g message-style         "fg=#c6c8d1,bg=#1e2132"
set -g message-command-style "fg=#c6c8d1,bg=#1e2132"

### Global statusline #########################################################
set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-style "fg=#c6c8d1,bg=#2e3244"

set -g status-left-length  40
set -g status-right-length 120
set -g status-left-style   none
set -g status-right-style  none

### Powerline‑like segments ###################################################
# Left:  [Session][User]
set -g status-left "#[fg=#2e3244,bg=#c6c8d1,bold] #S #[fg=#c6c8d1,bg=#2e3244,nobold]#[fg=#84a0c6,bg=#2e3244] #(whoami) "

# Right: [Time] [Host]  ← arrow removed before host
set -g status-right "#[fg=#2e3244,bg=#c6c8d1,bold] %H:%M #[fg=#84a0c6,bg=#2e3244,bold] #h "

### Window list ###############################################################
setw -g window-status-separator ""

# Inactive windows
setw -g window-status-style "fg=#6b7089,bg=#1e2132"
# Inactive
setw -g window-status-format \
  "#[fg=#2e3244,bg=#1e2132]#[fg=#c6c8d1,bg=#1e2132] #I:#{b:pane_current_path} #[fg=#1e2132,bg=#2e3244]"

# Active
setw -g window-status-current-format \
  "#[fg=#2e3244,bg=#84a0c6,bold]#[fg=#2e3244,bg=#84a0c6,bold] #I:#{b:pane_current_path} #[fg=#84a0c6,bg=#2e3244]"

# Activity underline
setw -g window-status-activity-style "underscore,fg=#c6c8d1,bg=#1e2132"

