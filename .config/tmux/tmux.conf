#### Basic Options ###########################################################

# Default Shell
set -g default-shell /bin/zsh            # change to fish if you use fish

# 24‑bit colour (Iceberg‑Dark)
set -as terminal-overrides ",*:Tc"      # advertise TrueColor to apps

# Prefix Key
unbind C-b                               # unbind default
set -g prefix C-t
set -g repeat-time 0                     # instantaneous repeat
set -g focus-events on

# FIXME: Unbind
unbind C-f

# Indexing
set -g base-index 1                      # windows start at 1
set -g pane-base-index 1                 # panes start at 1

# Escape timing (better vim latency)
set -sg escape-time 10

# History
set -g history-limit 65000

#### Key Bindings ############################################################

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# Open current directory in OS file manager (macOS `open`, others `xdg-open`)
bind o run-shell "open #{pane_current_path}"

# Close all other panes
bind -r e kill-pane -a

# Vim‑like pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 2
bind -r C-k resize-pane -U 2
bind -r C-l resize-pane -R 5

# Move windows with Ctrl‑Shift + ←/→
bind -n C-S-Left  swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

#### Copy Mode (vi) ##########################################################

set -g mode-keys vi

#### Look & Feel (Iceberg‑Dark palette) #####################################
# Palette reference (hex)
#   bg0 #161821   bg1 #1e2132   bg2 #2e3244
#   fg  #c6c8d1   dim #6b7089   accent #84a0c6

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e2132,fg=#c6c8d1"

# Window titles
setw -g window-status-style "fg=#6b7089,bg=#1e2132"
setw -g window-status-current-style "fg=#c6c8d1,bg=#2e3244,bold"
setw -g window-status-format  " #I:#W "
setw -g window-status-current-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=#2e3244"
set -g pane-active-border-style "fg=#84a0c6"

# Messages / prompts
set -g message-style "fg=#c6c8d1,bg=#2e3244"
set -g message-command-style "fg=#c6c8d1,bg=#2e3244"

# Display panes popup
set -g display-panes-colour "#6b7089"
set -g display-panes-active-colour "#84a0c6"

# Clock mode
setw -g clock-mode-colour "#84a0c6"

# Dynamic terminal/window title
set -g set-titles on
set -g set-titles-string '#T'

#### Plugins / Extras ########################################################

# macOS-specific tweaks
if-shell 'uname -s | grep -q Darwin' 'source ~/.config/tmux/macos.conf'

# Additional splits / statusline
source-file ~/.config/tmux/statusline.conf
source-file ~/.config/tmux/utility.conf
